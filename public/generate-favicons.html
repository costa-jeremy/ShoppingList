<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Générateur de Favicons CuisiNotes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 10px;
        }
        button {
            background: #198754;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #146c43;
        }
        .preview {
            display: inline-block;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Générateur de Favicons CuisiNotes</h1>
    <p>Cliquez sur les boutons pour télécharger les favicons aux bonnes tailles.</p>

    <div class="preview">
        <h3>192x192</h3>
        <canvas id="canvas192" width="192" height="192"></canvas>
        <br>
        <button onclick="download('canvas192', 'favicon-192.png')">Télécharger 192x192</button>
    </div>

    <div class="preview">
        <h3>512x512</h3>
        <canvas id="canvas512" width="512" height="512"></canvas>
        <br>
        <button onclick="download('canvas512', 'favicon-512.png')">Télécharger 512x512</button>
    </div>

    <script>
        function drawFavicon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');

            // Dessiner le cercle vert
            ctx.fillStyle = '#198754';
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
            ctx.fill();

            // Dessiner la lettre C
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.6}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('C', size/2, size/2 + size * 0.05);
        }

        function download(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }

        // Dessiner automatiquement au chargement
        window.onload = function() {
            drawFavicon('canvas192', 192);
            drawFavicon('canvas512', 512);
        };
    </script>
</body>
</html>
